plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ru.familybudget'
version = '0.1.0'

android {
  namespace "expo.modules.notificationlistener"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Будильник отправки по пушу (SendKick): разовая работа WorkManager с воркером expo-background-task.
  implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
